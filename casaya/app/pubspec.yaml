name: casaya
description: Servicios del hogar a domicilio. Una sola base de código para iOS, Android y web.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Estado y navegación
  flutter_riverpod: ^2.5.1        # estado reactivo, sin BuildContext colgando
  go_router: ^14.2.0              # rutas con URL real en web, deep links en móvil
  app_links: ^6.3.2               # recibe casaya:// en iOS y Android (app abierta, en 2º plano o cerrada)

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  cloud_functions: ^5.0.4
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.0.4

  # Mapas y ubicación (funcionan en móvil y web)
  google_maps_flutter: ^2.7.0
  google_maps_flutter_web: ^0.5.9
  geolocator: ^12.0.0

  # Multimedia y utilidades
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  url_launcher: ^6.3.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.1     # ícono TEMPORAL — reemplazar antes de publicar

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_temp.png"
  # Fondo del ícono adaptativo de Android ya viene resuelto en la imagen
  # (el cuadrado redondeado con relleno); no hace falta min_sdk_android
  # especial para este ícono simple.
  remove_alpha_ios: true              # Apple rechaza íconos con canal alfa

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
